<script>
'use strict';
(() => {
  const STATUS = {NEW:'Mới',RECEIVED:'Đã tiếp nhận',PROCESSING:'Đang xử lý',WAITING_ADDITIONAL_DOCUMENTS:'Chờ bổ sung',PAUSED:'Tạm dừng',TRANSFERRED:'Đã chuyển',COMPLETED:'Hoàn thành',RETURNED:'Đã trả lại',CANCELLED:'Đã hủy',OVERDUE:'Trễ hạn',UNKNOWN:'Chưa xác định'};
  const ALERT = {SAFE:'An toàn',WARNING:'Sắp đến hạn',OVERDUE:'Trễ hạn',REVIEW:'Cần xác minh',NEEDS_REVIEW:'Cần xác minh',STALE_DATA:'Dữ liệu cũ',SOURCE_ERROR:'Lỗi đồng bộ'};
  const ROLE = {SUPER_ADMIN:'Quản trị toàn hệ thống',ADMIN:'Quản trị viên',LEADER:'Lãnh đạo',MANAGER:'Quản lý đơn vị',OFFICER:'Cán bộ',VIEWER:'Chỉ xem'};
  const SOURCE_STATUS = {WAITING_FOR_SAMPLE:'Chờ mẫu portal',PARTIAL:'Một phần',IMPLEMENTED:'Đã có adapter',READY:'Sẵn sàng',NOT_LOGGED_IN:'Chưa đăng nhập',NOT_SYNCED:'Chưa đồng bộ',SYNCING:'Đang đồng bộ',SYNC_SUCCESS:'Đồng bộ thành công',SYNC_ERROR:'Lỗi đồng bộ',SUCCESS:'Thành công',ERROR:'Lỗi',ADAPTER_ERROR:'Lỗi adapter',DISABLED:'Đã tắt'};
  const TITLES = {dashboard:'Tổng quan điều hành',cases:'Danh sách hồ sơ',alerts:'Trung tâm cảnh báo',reports:'Báo cáo tổng hợp',statistics:'Thống kê',sources:'Nguồn dữ liệu',officers:'Cán bộ',users:'Người dùng',audit:'Nhật ký kiểm toán',settings:'Cấu hình nghiệp vụ',sync:'Lịch sử đồng bộ'};
  const SESSION_KEY='tthc.dashboard.session';
  let sessionToken='';
  try {sessionToken=sessionStorage.getItem(SESSION_KEY)||'';} catch (_) {}
  const state = {user:null,permissions:{},config:{},settings:{},sources:[],route:'dashboard',id:'',filters:{},request:0,result:null,sessionTime:null,clockOffset:0,sessionToken,loginAttempt:0,passwordChange:false};
  const app = document.querySelector('#app');
  const e = value => String(value == null ? '' : value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const array = value => Array.isArray(value) ? value : [];
  const number = value => value != null && Number.isFinite(Number(value)) ? Number(value).toLocaleString('vi-VN') : '—';
  const percent = value => value != null && Number.isFinite(Number(value)) ? Number(value).toLocaleString('vi-VN',{maximumFractionDigits:1})+'%' : '—';
  const now = () => Date.now()+state.clockOffset;
  function date(value, withTime=true) {
    if (!value || !Number.isFinite(new Date(value).getTime())) return '—';
    const format=new Intl.DateTimeFormat('vi-VN',{timeZone:'Asia/Ho_Chi_Minh',year:'numeric',month:'2-digit',day:'2-digit',...(withTime?{hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}:{})});
    const parts=Object.fromEntries(format.formatToParts(new Date(value)).map(part=>[part.type,part.value]));
    return parts.day+'/'+parts.month+'/'+parts.year+(withTime?' '+parts.hour+':'+parts.minute+':'+parts.second:'');
  }
  function duration(seconds) {
    const total = Math.max(0,Math.floor(Math.abs(Number(seconds)||0)));
    const days = Math.floor(total/86400), hours = Math.floor(total%86400/3600), minutes = Math.floor(total%3600/60);
    return days ? days+' ngày '+hours+' giờ' : hours ? hours+' giờ '+minutes+' phút' : minutes ? minutes+' phút' : 'dưới 1 phút';
  }
  function remaining(due) {
    if (!due || !Number.isFinite(new Date(due).getTime())) return 'Chưa xác minh ngày hẹn';
    const seconds=(new Date(due).getTime()-now())/1000;
    return (seconds<=0?'Quá hạn ':'Còn ')+duration(seconds);
  }
  function countdown(record) {
    if (['COMPLETED','RETURNED','CANCELLED'].includes(record.normalizedStatus)) return e(STATUS[record.normalizedStatus]);
    if (record.needsReview || ['REVIEW','NEEDS_REVIEW'].includes(record.alertLevel)) return 'Cần xác minh hạn trả';
    return '<span data-countdown="'+e(record.effectiveDueAt||'')+'">'+e(remaining(record.effectiveDueAt))+'</span>';
  }
  function collectionRange(context) {
    if (!context) return '<span class="cell-secondary">Chưa ghi nhận khoảng ngày nộp</span>';
    const day=value=>value?date(value,false):'Không giới hạn';
    return '<span class="cell-secondary">Ngày nộp từ ngày: '+e(day(context.submittedFrom))+' · đến ngày: '+e(day(context.submittedTo))+'</span><span class="cell-secondary">Đọc bộ lọc lúc '+e(date(context.capturedAt))+' · Trang hiện tại</span>';
  }
  function observation(record) {
    if (!record.lastObservedAt || !Number.isFinite(new Date(record.lastObservedAt).getTime())) return '<span class="badge review">Chưa có quan sát</span>';
    const age=Math.max(0,(now()-new Date(record.lastObservedAt).getTime())/1000);
    const staleSeconds=Number(state.settings.staleSeconds);
    const stale=record.isStale === true || record.stale === true || (Number.isFinite(staleSeconds) && age>staleSeconds);
    return '<span class="cell-primary">'+e(date(record.lastObservedAt))+'</span>'+ (stale?'<span class="cell-secondary stale-note">Chưa cập nhật trong '+e(duration(age))+'</span>':'<span class="cell-secondary">Quan sát từ cổng nguồn</span>');
  }
  function safeUrl(value) {
    try {const url=new URL(value);return url.protocol==='https:'?url.href:'';} catch (_) {return '';}
  }
  function sourceId(source) {return source.id||source.sourceSystem||source.sourceId||'';}
  function sourceName(source) {return source.name||source.sourceName||sourceId(source);}
  function sourceLabel(id) {const source=state.sources.find(item=>sourceId(item)===id);return source?sourceName(source):id||'—';}
  function portal(value,label='Mở cổng nguồn ↗') {
    const url=safeUrl(value);return url?'<a class="text-link" href="'+e(url)+'" target="_blank" rel="noopener noreferrer">'+e(label)+'</a>':'<span class="muted">Chưa có liên kết</span>';
  }
  function icon(name) {
    const paths={dashboard:'M3 3h7v7H3z M14 3h7v7h-7z M3 14h7v7H3z M14 14h7v7h-7z',cases:'M4 4h6l2 3h8v13H4z M4 10h16',alerts:'M12 3 2 21h20L12 3z M12 9v5 M12 17h.01',sources:'M9 4H4v5 M15 4h5v5 M4 15v5h5 M20 15v5h-5 M9 9h6v6H9z',users:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8',reports:'M4 3h12l4 4v14H4z M8 16v-4 M12 16V9 M16 16v-6',settings:'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8 M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2',audit:'M4 3h16v18H4z M8 7h8 M8 12h8 M8 17h5',shield:'M12 2 3 6v6c0 5 9 10 9 10s9-5 9-10V6l-9-4z M8 12l3 3 5-6',menu:'M3 6h18 M3 12h18 M3 18h18',sync:'M20 7a8 8 0 0 0-14-2L3 8 M3 3v5h5 M4 17a8 8 0 0 0 14 2l3-3 M16 16h5v5'};
    return '<svg class="icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="'+(paths[name]||paths.cases)+'"/></svg>';
  }
  function badge(code,label) {return '<span class="badge '+(/^[A-Z_]+$/.test(code||'')?code.toLowerCase():'unknown')+'"><span class="badge-dot" aria-hidden="true"></span>'+e(label||ALERT[code]||STATUS[code]||SOURCE_STATUS[code]||code||'Chưa xác định')+'</span>';}
  function empty(title='Chưa có dữ liệu',message='Kết quả sẽ hiển thị sau khi dữ liệu được đồng bộ trong phạm vi được cấp.',action='') {return '<div class="empty-state"><span class="empty-symbol" aria-hidden="true">◇</span><h3>'+e(title)+'</h3><p>'+e(message)+'</p>'+action+'</div>';}
  function notice(message,type='') {return '<div class="notice '+e(type)+'"><p>'+e(message)+'</p></div>';}
  function loading(message='Đang tải dữ liệu…') {return '<div class="loading-state" role="status"><span class="spinner" aria-hidden="true"></span>'+e(message)+'</div>';}
  function toast(message,type='success') {const node=document.createElement('div'),region=document.querySelector('#toast-region');node.className='toast '+(type==='error'?'error':'success');node.textContent=message;while(region.children.length>=2)region.firstElementChild.remove();region.append(node);setTimeout(()=>node.remove(),6500);}
  function rpc(action,payload={}) {
    const started=performance.now();
    const recordTiming=(response)=>{
      const entries=window.__tthcPerformance||(window.__tthcPerformance=[]);
      entries.push({action,totalMs:Math.round(performance.now()-started),serverMs:response?.timing?.serverMs??null,repositoryReadMs:response?.timing?.repositoryReadMs??null,repositoryReadCalls:response?.timing?.repositoryReadCalls??null,ok:response?.ok===true});
      if(entries.length>100)entries.shift();
    };
    return new Promise((resolve,reject)=>{
      if (!window.google || !google.script || !google.script.run) {reject(Object.assign(new Error('Trang này cần được mở từ Web App Google Apps Script đã triển khai.'),{code:'APPS_SCRIPT_REQUIRED'}));return;}
      google.script.run.withSuccessHandler(response=>{
        recordTiming(response);
        if (response && response.ok===true) resolve(response.data);
        else {const detail=response&&response.error||{};reject(Object.assign(new Error(detail.message||'Yêu cầu chưa hoàn tất. Vui lòng thử lại.'),{code:detail.code||'SERVER_ERROR',requestId:detail.requestId}));}
      }).withFailureHandler(error=>{recordTiming(null);reject(Object.assign(new Error(error&&error.message||'Không thể kết nối máy chủ. Vui lòng thử lại.'),{code:'CONNECTION_ERROR'}));}).rpc(action,payload,state.sessionToken);
    });
  }
  const option=(value,label,selected)=>'<option value="'+e(value)+'"'+(String(value)===String(selected==null?'':selected)?' selected':'')+'>'+e(label)+'</option>';
  const field=(label,control,note='')=>'<label class="field"><span>'+e(label)+'</span>'+control+(note?'<small>'+e(note)+'</small>':'')+'</label>';
  const input=(name,type='text',value='',extra='')=>'<input name="'+e(name)+'" type="'+e(type)+'" value="'+e(value)+'" '+extra+'>';
  function select(name,values,selected,placeholder='Tất cả') {return '<select name="'+e(name)+'">'+(placeholder!==null?option('',placeholder,selected):'')+values.map(row=>option(row[0],row[1],selected)).join('')+'</select>';}
  function heading(title,description,actions='') {return '<div class="page-heading"><div><div class="eyebrow">TTHC MONITOR</div><h1>'+e(title)+'</h1><p>'+e(description)+'</p></div><div class="heading-actions">'+actions+'</div></div>';}
  function panel(title,subtitle,content,actions='',body=false) {return '<section class="panel"><div class="panel-heading"><div><h2>'+e(title)+'</h2>'+(subtitle?'<p>'+e(subtitle)+'</p>':'')+'</div>'+actions+'</div>'+(body?'<div class="panel-body">'+content+'</div>':content)+'</section>';}
  function table(headers,rows) {return '<div class="table-scroll"><table class="data-table"><thead><tr>'+headers.map(header=>'<th scope="col">'+e(header)+'</th>').join('')+'</tr></thead><tbody>'+rows.join('')+'</tbody></table></div>';}
  function link(page,params={},id='') {const query=new URLSearchParams({...params,...(id?{id}:{})});return '#'+page+(query.toString()?'?'+query.toString():'');}
  function readRoute() {
    const text=location.hash.slice(1)||'dashboard';const split=text.indexOf('?');const route=split<0?text:text.slice(0,split);const params=new URLSearchParams(split<0?'':text.slice(split+1));
    state.route=Object.hasOwn(TITLES,route)?route:'dashboard';state.id=params.get('id')||'';params.delete('id');state.filters=Object.fromEntries(params);
  }
  function navigate(page,params={},id='') {const target=link(page,params,id);if(location.hash===target)render();else location.hash=target;}
  function can(permission) {return state.permissions[permission]===true;}
  function caseFilters() {
    const accepted=['q','sourceSystem','normalizedStatus','alertLevel','agencyName','departmentName','officerName','procedureName','agencyKey','departmentKey','officerKey','procedureKey','submittedFrom','submittedTo','receivedFrom','receivedTo','dueFrom','dueTo','observedBefore','sortBy','sortDirection','bucket'];
    return Object.fromEntries(Object.entries(state.filters).filter(([key])=>accepted.includes(key)));
  }
  function filters({cases=false,reports=false,reportPeriod=false,alerts=false,audit=false}={}) {
    const f=state.filters;
    return '<form id="filter-form" class="filters">'+field(audit?'Tìm hành động / đối tượng':'Mã hồ sơ hoặc từ khóa',input('q','search',f.q||'','maxlength="160" placeholder="Mã hồ sơ hoặc từ khóa…"'))+
      (!audit?field('Nguồn dữ liệu',select('sourceSystem',state.sources.map(source=>[sourceId(source),sourceName(source)]),f.sourceSystem)):'')+
      (state.route==='dashboard'||cases||reports?field('Ngày nộp từ ngày',input('submittedFrom','date',f.submittedFrom||''))+field('Ngày nộp đến ngày',input('submittedTo','date',f.submittedTo||'')):'')+
      (cases||reports?field('Cơ quan',input('agencyName','text',f.agencyName||'','maxlength="160"'))+field('Cán bộ',input('officerName','text',f.officerName||'','maxlength="160"')):'')+
      (alerts?field('Nhóm cảnh báo',select('kind',[['OVERDUE','Quá hạn'],['WARNING','Sắp đến hạn'],['STALE_DATA','Chưa cập nhật dữ liệu'],['SOURCE_ERROR','Lỗi đồng bộ nguồn'],['NEEDS_REVIEW','Cần xác minh']],f.kind)):'')+
      '<button class="button" type="submit">Lọc dữ liệu</button><button class="button secondary" type="button" data-clear-filters>Xóa lọc</button>'+
      (cases?'<details class="advanced-filter-details" '+(['departmentName','procedureName','normalizedStatus','alertLevel','dueFrom','dueTo','observedBefore'].some(key=>f[key])?'open':'')+'><summary>Bộ lọc thêm · trạng thái, hạn trả, quan sát</summary><div class="advanced-filters">'+
       field('Phòng / đơn vị',input('departmentName','text',f.departmentName||'','maxlength="160"'))+field('Thủ tục',input('procedureName','text',f.procedureName||'','maxlength="160"'))+
       field('Trạng thái',select('normalizedStatus',Object.entries(STATUS),f.normalizedStatus))+field('Cảnh báo',select('alertLevel',Object.entries(ALERT).filter(item=>!['STALE_DATA','SOURCE_ERROR'].includes(item[0])),f.alertLevel))+
       field('Hẹn trả từ ngày',input('dueFrom','date',f.dueFrom||''))+field('Hẹn trả đến ngày',input('dueTo','date',f.dueTo||''))+field('Quan sát trước ngày',input('observedBefore','date',f.observedBefore||''))+
       field('Sắp xếp',select('sortBy',[['priority','Ưu tiên xử lý'],['dueAt','Hạn trả'],['lastObservedAt','Quan sát lần cuối'],['receivedAt','Ngày tiếp nhận']],f.sortBy||'priority',null))+
       field('Chiều sắp xếp',select('sortDirection',[['asc','Tăng dần'],['desc','Giảm dần']],f.sortDirection||'asc',null))+
       field('Số dòng / trang',select('pageSize',[['25','25'],['50','50'],['100','100']],f.pageSize||'25',null))+'</div></details>':'')+
      (reports?'<div class="advanced-filters">'+(reportPeriod?field('Kỳ báo cáo',select('period',[['day','Hôm nay'],['week','Tuần này'],['month','Tháng này'],['custom','Khoảng tùy chọn']],f.period||'month',null)):'')+field('Tiếp nhận từ ngày',input('receivedFrom','date',f.receivedFrom||''))+field('Tiếp nhận đến ngày',input('receivedTo','date',f.receivedTo||''))+field('Đơn vị',input('departmentName','text',f.departmentName||'','maxlength="160"'))+'</div>':'')+'</form>';
  }
  function pagination(result) {
    const page=Number(result.page)||1,size=Number(result.pageSize)||25,total=Number(result.total)||0,pages=Math.max(1,Math.ceil(total/size));
    return '<div class="pagination"><span>'+(total?number((page-1)*size+1)+'–'+number(Math.min(page*size,total)):'0')+' / '+number(total)+' kết quả</span><div><button class="button ghost small" data-page="'+(page-1)+'" '+(page<=1?'disabled':'')+'>← Trước</button><span>Trang '+number(page)+' / '+number(pages)+'</span><button class="button ghost small" data-page="'+(page+1)+'" '+(page>=pages?'disabled':'')+'>Sau →</button></div></div>';
  }
  function caseTable(items,compact=false) {
    if (!array(items).length) return empty('Không có hồ sơ phù hợp','Thử điều chỉnh bộ lọc hoặc kiểm tra tình trạng đồng bộ tại Nguồn dữ liệu.');
    return table(compact?['Hồ sơ / thủ tục','Cán bộ / bước','Hạn trả / thời gian','Quan sát lần cuối','Cảnh báo']:['Hồ sơ / nguồn','Thủ tục','Cơ quan / cán bộ','Bước xử lý','Ngày hẹn trả','Thời gian','Quan sát lần cuối','Trạng thái / cảnh báo'],items.map(record=>{
      const caseCell='<a class="cell-primary text-link" href="'+e(link('cases',{},record.id))+'">'+e(record.caseCode||record.id)+'</a><span class="cell-secondary">'+e(compact?record.procedureName:sourceLabel(record.sourceSystem))+'</span>';
      const step=record.currentStep!=null?e(record.currentStep)+(record.totalSteps!=null?' / '+e(record.totalSteps):''):'<span class="muted">Nguồn chưa cung cấp</span>';
      return compact?'<tr><td class="wrap">'+caseCell+'</td><td>'+e(record.officerName||'Chưa phân công')+'<span class="cell-secondary">Bước '+step+'</span></td><td>'+e(date(record.effectiveDueAt))+'<span class="cell-secondary">'+countdown(record)+'</span></td><td>'+observation(record)+collectionRange(record.lastCollectionContext)+'</td><td>'+badge(record.alertLevel)+'</td></tr>':
        '<tr><td>'+caseCell+'</td><td class="wrap">'+e(record.procedureName||'—')+'</td><td>'+e(record.agencyName||'—')+'<span class="cell-secondary">'+e(record.officerName||'Chưa phân công')+'</span></td><td>'+step+'</td><td>'+e(date(record.effectiveDueAt))+'</td><td>'+countdown(record)+'</td><td>'+observation(record)+collectionRange(record.lastCollectionContext)+'</td><td>'+badge(record.normalizedStatus)+'<span class="cell-secondary">'+badge(record.alertLevel)+'</span></td></tr>';
    }));
  }
  function metric(label,value,noteText,kind='',href='') {return '<'+(href?'a href="'+e(href)+'"':'div')+' class="metric '+e(kind)+'"><div class="metric-label">'+e(label)+'</div><div class="metric-symbol">'+icon(kind==='overdue'||kind==='warning'?'alerts':'cases')+'</div><div class="metric-value">'+e(value)+'</div><div class="metric-note">'+e(noteText)+'</div></'+(href?'a':'div')+'>';}
  function kpis(k,report=false) {
    const f=caseFilters();
    return '<div class="metrics">'+metric('Đang xử lý',number(k.totalProcessing),'Trong phạm vi được cấp','',link('cases',{...f,bucket:'active'}))+
      metric('Sắp đến hạn',number(k.warning),'Ngưỡng cảnh báo theo cấu hình','warning',link('cases',{...f,alertLevel:'WARNING'}))+
      metric('Trễ hạn',number(k.overdue),'Theo hạn trả hiệu lực','overdue',link('cases',{...f,alertLevel:'OVERDUE'}))+
      metric('Tỷ lệ hoàn thành đúng hạn',percent(k.onTimeRate),'Đúng hạn / hồ sơ hoàn thành có hạn xác minh','',link('cases',{...f,bucket:'completed'}))+'</div>'+
      (report?'<div class="metrics">'+metric('Tổng hồ sơ',number(k.total),'Trong bộ lọc báo cáo')+metric('Hoàn thành',number(k.completed),'Dữ liệu từ nguồn')+metric('Hoàn thành trễ',number(k.completedLate),'Sau ngày hẹn trả')+metric('Cần xác minh',number(k.unknown),'Trạng thái / hạn chưa xác định')+'</div>':'');
  }
  function distribution(items) {
    if (!array(items).length) return empty('Chưa có phân bố','Chưa có dữ liệu hồ sơ để thống kê trạng thái.');
    const total=items.reduce((sum,row)=>sum+(Number(row.count)||0),0);
    if (!total) return empty('Chưa có hồ sơ','Phân bố sẽ xuất hiện sau lượt đồng bộ đầu tiên.');
    const colors=['#30728f','#4c9c74','#d7b043','#cd5864','#8357a3','#598bcb','#8b99a7'];
    return '<div class="distribution" aria-hidden="true">'+items.map((row,i)=>'<span style="flex:'+Math.max(0,Number(row.count)||0)+';background:'+colors[i%colors.length]+'"></span>').join('')+'</div><div class="legend">'+items.map((row,i)=>'<div class="legend-row"><span><i class="dot" style="background:'+colors[i%colors.length]+'"></i>'+e(STATUS[row.status]||row.status)+'</span><strong>'+number(row.count)+'</strong></div>').join('')+'</div>';
  }
  function groupTable(items,dimension,clickable=true) {
    if (!array(items).length) return empty('Chưa có thống kê','Kết quả được tổng hợp từ hồ sơ trong phạm vi được cấp.');
    const filterKeys={source:'sourceSystem',agency:'agencyKey',department:'departmentKey',officer:'officerKey',procedure:'procedureKey'};
    return table(['Tên / phạm vi','Tổng hồ sơ','Đang xử lý','Sắp hạn','Trễ hạn','Đúng hạn','Tỷ lệ đúng hạn'],items.map(row=>{
      const k=row.kpis||row,key=row.key||row.id||row.name||row.label,label=row.label||row.name||key||'Chưa xác định';
      return '<tr><td class="wrap">'+(clickable?'<a class="text-link" href="'+e(link('cases',{...caseFilters(),[filterKeys[dimension]||'q']:key}))+'">'+e(label)+'</a>':e(label))+'</td><td>'+number(k.total)+'</td><td>'+number(k.totalProcessing)+'</td><td>'+number(k.warning)+'</td><td>'+number(k.overdue)+'</td><td>'+number(k.onTime)+'</td><td>'+percent(k.onTimeRate)+'</td></tr>';
    }));
  }
  function barChart(items,dimension) {
    const rows=array(items).slice().sort((a,b)=>Number((b.kpis||b).total)-Number((a.kpis||a).total)).slice(0,8);
    if(!rows.length)return empty('Chưa có biểu đồ','Biểu đồ được tính từ hồ sơ đã đồng bộ.');
    const maximum=Math.max(1,...rows.map(row=>Number((row.kpis||row).total)||0));
    const fields={source:'sourceSystem',officer:'officerKey',procedure:'procedureKey'};
    return '<div class="bar-chart">'+rows.map(row=>{const k=row.kpis||row,value=Number(k.total)||0,key=row.key||row.id||row.label,label=row.label||row.name||key;return '<a class="bar-row" href="'+e(link('cases',{...caseFilters(),[fields[dimension]]:key}))+'"><span class="bar-label">'+e(label)+'</span><span class="bar-track" aria-hidden="true"><i style="width:'+Math.round(value/maximum*100)+'%"></i></span><strong>'+number(value)+'</strong></a>';}).join('')+'</div>';

  function completionChart(k) {
    if(k.onTime==null||k.completedLate==null)return empty('Chưa có kết quả hoàn thành','Nguồn chưa cung cấp đủ ngày hoàn thành và ngày hẹn trả.');

    if(!total)return empty('Chưa có hồ sơ hoàn thành được xác minh','Tỷ lệ đúng hạn được tính khi có hồ sơ hoàn thành và hạn trả.');

d="account-switch">Đăng xuất</button></div></header><main class="content" id="page-content" tabindex="-1">'+loading()+'</main></div></div>';

  function errorState(error) {
    const denied=['ACCESS_DENIED','FORBIDDEN','SCOPE_DENIED','PERMISSION_DENIED'].includes(error.code);
    return empty(denied?'Bạn chưa được cấp quyền':'Không thể tải dữ liệu',denied?'Tài khoản của bạn chưa được cấp quyền sử dụng hệ thống. Vui lòng liên hệ Quản trị viên.':error.message,'<button class="button secondary" data-refresh>Thử lại</button>')+(error.requestId?'<p class="error-request">Mã yêu cầu: '+e(error.requestId)+'</p>':'');
  }
  async function render() {
    if(!state.user||state.passwordChange)return;
    if(state.user.mustChangePassword){showPasswordChange(true);return;}
    readRoute();const sequence=++state.request;shell();
    const content=document.querySelector('#page-content');
    content.dataset.routeKey=location.hash||'#dashboard';content.setAttribute('aria-busy','true');
    try {
      const pages={dashboard,cases,alerts,reports:()=>reports(false),statistics:()=>reports(true),sources,officers,users,audit,settings,sync};
      const markup=await pages[state.route]();if(sequence!==state.request||!state.user)return;
      content.innerHTML=markup+'<footer class="page-footer"><span>Dữ liệu hiển thị theo phạm vi quyền được cấp.</span><span>Hạn trả từ cổng nguồn · Giờ Việt Nam (UTC+07:00)</span></footer>';
      content.setAttribute('aria-busy','false');bindPage();updateCountdowns();document.title=(state.id?'Chi tiết hồ sơ':TITLES[state.route])+' · TTHC Monitor';
    } catch(error) {if(sequence!==state.request)return;if(error.code==='PASSWORD_CHANGE_REQUIRED'){state.user.mustChangePassword=true;showPasswordChange(true);return;}if(['AUTH_REQUIRED','UNAUTHENTICATED'].includes(error.code)){setSessionToken('');showLogin(error.message,error);return;}content.innerHTML=errorState(error);content.setAttribute('aria-busy','false');bindPage();}
  }
  function formPayload(form) {return Object.fromEntries(new FormData(form));}
  async function runButton(button,operation,label='Đang xử lý…') {
    const old=button.textContent;button.disabled=true;button.dataset.apiPending='true';button.textContent=label;
    try{return await operation();}catch(error){toast(error.message,'error');return null;}finally{if(button.isConnected){button.disabled=false;delete button.dataset.apiPending;button.textContent=old;}}
  }
  function download(result) {
    if(!result||typeof result.content!=='string')throw new Error('Máy chủ chưa trả tệp xuất hợp lệ.');
    const url=URL.createObjectURL(new Blob([result.content],{type:result.mimeType||'text/csv;charset=utf-8'}));
    const anchor=document.createElement('a');anchor.href=url;anchor.download=result.filename||'tthc-report.csv';document.body.append(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
  }
  function showAccountCredentials(result) {

    region.innerHTML=panel('Thông tin cấp tài khoản','Gửi tên đăng nhập và mật khẩu mặc định cho người dùng.',notice('Người dùng phải đổi mật khẩu này khi đăng nhập. Đặt lại mật khẩu kết thúc các phiên đăng nhập và token extension cũ.')+'<div class="form-grid">'+field('Tên đăng nhập',input('issuedUsername','text',result.user.username||'','readonly autocomplete="off"'))+field('Mật khẩu mặc định',input('defaultPassword','text',result.defaultPassword,'readonly autocomplete="off" spellcheck="false"'))+'</div><div class="form-actions"><button class="button secondary" type="button" data-clear-credentials>Xóa khỏi màn hình</button></div>','',true);

  function bindUserForm() {
    document.querySelector('#user-form')?.addEventListener('submit',async event=>{
      event.preventDefault();const form=event.currentTarget,v=formPayload(form),button=form.querySelector('[type="submit"]'),errorNode=document.querySelector('#user-error');errorNode.textContent='';

      if(button.disabled)return;
      const payload={username:v.username,displayName:v.displayName,role:v.role,status:v.status,scope};if(form.dataset.userId)payload.id=form.dataset.userId;
      await runButton(button,async()=>{try{const result=await rpc(form.dataset.userId?'users.update':'users.create',payload);toast(form.dataset.userId?'Đã lưu tài khoản.':'Đã cấp tài khoản.');await render();if(result.defaultPassword)showAccountCredentials(result);}catch(error){errorNode.textContent=error.message;throw error;}});
    });

    document.querySelectorAll('[data-toggle-source]').forEach(button=>button.addEventListener('click',()=>runButton(button,async()=>{await rpc('sources.update',{id:button.dataset.toggleSource,enabled:button.dataset.enabled!=='true'});toast('Đã cập nhật trạng thái nguồn.');await render();})));

    document.querySelectorAll('[data-toggle-user]').forEach(button=>button.addEventListener('click',()=>runButton(button,async()=>{const user=array(state.result&&state.result.items).find(item=>item.id===button.dataset.toggleUser);if(!user)throw new Error('Không tìm thấy người dùng. Hãy tải lại danh sách.');await rpc('users.update',{id:user.id,displayName:user.displayName,role:user.role,scope:user.scope,status:user.status==='ACTIVE'?'DISABLED':'ACTIVE'});toast('Đã cập nhật trạng thái người dùng.');await render();})));

    document.querySelector('#token-form')?.addEventListener('submit',event=>{

      event.preventDefault();const form=event.currentTarget,button=form.querySelector('[type="submit"]'),retry=document.querySelector('#forgot-password'),errorNode=document.querySelector('#login-error');
      if(button.disabled||state.config.configured===false)return;
      const attempt=++state.loginAttempt,values=formPayload(form);errorNode.textContent='';retry.disabled=true;
      await runButton(button,async()=>{
        try {
          const result=await rpc('auth.login',{username:values.username.trim(),password:values.password});
          if(attempt!==state.loginAttempt)return;
          if(!result||!result.sessionToken)throw new Error('Máy chủ chưa tạo được phiên đăng nhập. Vui lòng thử lại.');
          form.elements.password.value='';setSessionToken(result.sessionToken);await bootstrap();
        } catch(error) {
          if(attempt!==state.loginAttempt)return;
          form.elements.password.value='';errorNode.textContent=error.message;form.elements.password.focus();throw error;
        } finally {if(retry.isConnected)retry.disabled=false;}
      },'Đang đăng nhập…');
    });
    document.querySelector('#forgot-password').addEventListener('click',()=>showRecovery('request'));
  }
  function applySession(session) {
    if(!session||!session.user||session.user.status!=='ACTIVE')throw Object.assign(new Error('Tài khoản của bạn chưa được cấp quyền sử dụng hệ thống. Vui lòng liên hệ Quản trị viên.'),{code:'ACCESS_DENIED'});
    if(session.sessionToken)setSessionToken(session.sessionToken);
    state.user=session.user;state.permissions=session.permissions||{};state.sessionTime=session.serverTime;state.clockOffset=session.serverTime?new Date(session.serverTime).getTime()-Date.now():0;
  }
  async function showRecovery(mode,token='') {
    const sequence=++state.request;state.passwordChange=true;
    const titles={request:'Quên mật khẩu',enroll:'Email khôi phục',verify:'Xác minh email',reset:'Đặt lại mật khẩu'};
    const descriptions={request:'Nhập tên tài khoản để nhận liên kết qua email đã xác minh. Liên kết có hiệu lực 15 phút.',enroll:'Xác minh email khi bạn còn đăng nhập để có thể tự đặt lại mật khẩu sau này.',verify:'Bấm xác nhận để dùng email này làm email khôi phục tài khoản.',reset:'Đặt mật khẩu mới có từ 10 đến 128 ký tự.'};
    let existing={};
    if(mode==='enroll') {
      app.innerHTML=loginLayout(loading());
      try {existing=await rpc('auth.recovery.status');} catch(error) {if(sequence===state.request){state.passwordChange=false;showLogin(error.message,error);}return;}
      if(sequence!==state.request)return;
    }
    const labels={request:'Gửi liên kết đặt lại',enroll:'Gửi email xác minh',verify:'Xác nhận email',reset:'Lưu mật khẩu mới'};
    const controls=mode==='request'?field('Tên tài khoản',input('username','text','','required minlength="3" maxlength="64" autocomplete="username"')):
      mode==='enroll'?field('Email khôi phục',input('email','email',existing.email||'','required maxlength="254" autocomplete="email"'))+field('Mật khẩu hiện tại',input('currentPassword','password','','required maxlength="128" autocomplete="current-password"')):
      mode==='reset'?field('Mật khẩu mới',input('newPassword','password','','required minlength="10" maxlength="128" autocomplete="new-password"'))+field('Nhập lại mật khẩu mới',input('confirmPassword','password','','required minlength="10" maxlength="128" autocomplete="new-password"')):'';
    document.title=titles[mode]+' · TTHC Monitor';
    app.innerHTML=loginLayout('<h1>'+titles[mode]+'</h1><p>'+descriptions[mode]+'</p>'+(mode==='enroll'&&existing.verified?notice('Email hiện tại đã được xác minh. Thay đổi chỉ có hiệu lực sau khi xác minh email mới.'):'')+'<form id="recovery-form">'+controls+'<p id="recovery-message" role="status" aria-live="polite"></p><button class="button" type="submit">'+labels[mode]+'</button></form><button id="recovery-back" type="button" class="button secondary">'+(mode==='enroll'?'Quay lại':'Về đăng nhập')+'</button>'+(mode==='request'?'<p class="login-footnote">Nếu chưa xác minh email hoặc không còn truy cập email, hãy liên hệ quản trị viên để được đặt lại mật khẩu.</p>':''));
    document.querySelector('#recovery-back').addEventListener('click',()=>{state.passwordChange=false;bootstrap();});
    document.querySelector('#recovery-form').addEventListener('submit',async event=>{
      event.preventDefault();const form=event.currentTarget,button=form.querySelector('button'),message=document.querySelector('#recovery-message'),values=formPayload(form);
      if(button.disabled)return;
      if(mode==='reset'&&values.newPassword!==values.confirmPassword){message.textContent='Mật khẩu nhập lại chưa khớp.';return;}
      const payload=mode==='request'?{username:values.username.trim()}:mode==='enroll'?{email:values.email.trim(),currentPassword:values.currentPassword}:mode==='reset'?{token,newPassword:values.newPassword}:{token};
      await runButton(button,async()=>{
        try {
          const result=await rpc('auth.recovery.'+mode,payload);
          if(sequence!==state.request)return;
          form.reset();message.textContent=result.message;
          if(mode==='reset'){setSessionToken('');state.user=null;}
          if(mode==='verify'||mode==='reset')form.querySelector('button').remove();
        } catch(error) {if(sequence===state.request){message.textContent=error.message;form.querySelectorAll('input[type=password]').forEach(node=>{node.value='';});}}
      },'Đang xử lý…');
    });
  }
  function showPasswordChange(required=Boolean(state.user&&state.user.mustChangePassword)) {
    if(!state.user)return;
    ++state.request;state.passwordChange=true;state.result=null;
    document.title='Đổi mật khẩu · TTHC Monitor';
    app.innerHTML=loginLayout('<div class="eyebrow">'+e(state.user.username||state.user.displayName)+'</div><h1>'+(required?'Đổi mật khẩu lần đầu':'Đổi mật khẩu')+'</h1><p>'+(required?'Đặt mật khẩu riêng để tiếp tục sử dụng hệ thống.':'Cập nhật mật khẩu cho tài khoản của bạn.')+'</p><form id="password-form">'+field('Mật khẩu hiện tại',input('currentPassword','password','','required maxlength="128" autocomplete="current-password"'))+field('Mật khẩu mới',input('newPassword','password','','required minlength="10" maxlength="128" autocomplete="new-password"'),'10–128 ký tự, khác mật khẩu hiện tại và mật khẩu mặc định.')+field('Nhập lại mật khẩu mới',input('confirmPassword','password','','required minlength="10" maxlength="128" autocomplete="new-password"'))+'<p id="password-error" class="error-inline" role="alert"></p><button class="button" type="submit">Lưu mật khẩu</button></form>'+(!required?'<button class="button secondary" type="button" id="cancel-password-change">Hủy</button>':'')+'<button class="button ghost" type="button" id="password-logout">Đăng xuất</button>');
    document.querySelector('#password-form').addEventListener('submit',async event=>{
      event.preventDefault();const form=event.currentTarget,button=form.querySelector('[type="submit"]'),values=formPayload(form),errorNode=document.querySelector('#password-error'),request=state.request;
      if(button.disabled)return;
      errorNode.textContent='';
      if(values.newPassword!==values.confirmPassword){errorNode.textContent='Mật khẩu nhập lại chưa khớp.';form.elements.confirmPassword.focus();return;}
      const controls=[document.querySelector('#cancel-password-change'),document.querySelector('#password-logout')].filter(Boolean);controls.forEach(node=>{node.disabled=true;});
      await runButton(button,async()=>{
        try {
          const result=await rpc('auth.changePassword',{currentPassword:values.currentPassword,newPassword:values.newPassword});
          if(request!==state.request)return;
          applySession(result);form.reset();state.passwordChange=false;toast('Đã đổi mật khẩu.');await bootstrap();
        } catch(error) {
          if(request!==state.request)return;
          if(['AUTH_REQUIRED','UNAUTHENTICATED'].includes(error.code)){setSessionToken('');showLogin(error.message,error);return;}
          errorNode.textContent=error.message;form.elements.currentPassword.value='';form.elements.currentPassword.focus();throw error;
        } finally {controls.forEach(node=>{if(node.isConnected)node.disabled=false;});}
      },'Đang lưu mật khẩu…');
    });
    document.querySelector('#cancel-password-change')?.addEventListener('click',()=>{state.passwordChange=false;bootstrap();});
    document.querySelector('#password-logout').addEventListener('click',event=>runButton(event.currentTarget,logout));
    document.querySelector('[name="currentPassword"]').focus();
  }
  async function bootstrap() {
    const sequence=++state.request;state.passwordChange=false;app.innerHTML='<main id="page-content">'+loading('Đang kiểm tra phiên đăng nhập…')+'</main>';
    try {
      const initial=await rpc('auth.bootstrap');if(sequence!==state.request)return;state.config=initial.config;
      if(!state.sessionToken){showLogin(state.config.configured===false?'Quản trị viên chưa hoàn tất cấu hình tài khoản.':'');return;}
      if(state.config.configured===false){showLogin('Quản trị viên chưa hoàn tất cấu hình tài khoản.');return;}
      const session=initial.session;applySession(session);
      if(state.user.mustChangePassword||session.mustChangePassword){state.user.mustChangePassword=true;showPasswordChange(true);return;}
      state.sources=array(initial.sources.items);state.settings=initial.settings;
      await render();
    } catch(error) {
      if(sequence!==state.request)return;
      if(error.code==='PASSWORD_CHANGE_REQUIRED'&&state.user){state.user.mustChangePassword=true;showPasswordChange(true);return;}
      const denied=['ACCESS_DENIED','FORBIDDEN','UNAUTHENTICATED','AUTH_REQUIRED','PERMISSION_DENIED'].includes(error.code);
      if(denied)setSessionToken('');
      showLogin(error.message,error);
    }
  }
  function updateCountdowns() {document.querySelectorAll('[data-countdown]').forEach(node=>{node.textContent=remaining(node.dataset.countdown);});}
  // Keep internal navigation in the HTML Service iframe despite base target="_top".
  document.addEventListener('click',event=>{
    const anchor=event.target.closest?.('a[href^="#"]');
    if(!anchor || anchor.hasAttribute('download') || (anchor.hasAttribute('target') && anchor.getAttribute('target')!=='_self'))return;
    const target=anchor.getAttribute('href');
    if(!Object.hasOwn(TITLES,target.slice(1).split('?')[0]))return;
    event.preventDefault();
    if(location.hash===target)render();else location.hash=target;
  });
  window.addEventListener('hashchange',()=>{if(state.user)render();});
  document.addEventListener('keydown',event=>{if(event.key==='Escape'){document.querySelector('#sidebar')?.classList.remove('open');document.querySelector('#menu-toggle')?.setAttribute('aria-expanded','false');}});
  setInterval(updateCountdowns,30000);
  if(window.google?.script?.url?.getLocation) {
    google.script.url.getLocation(locationInfo=>{
      const params=locationInfo.parameter||{};
      if(['verify','reset'].includes(params.recovery)&&/^tthc\.r\.[a-f0-9]{64}$/.test(params.token||''))showRecovery(params.recovery,params.token);
      else bootstrap();
    });
  } else bootstrap();
})();
</script>
